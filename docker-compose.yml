# docker-compose.yml — local development
#
# Services:
#   backend  — Flask dev server with hot reload via gunicorn --reload
#   frontend — Vite dev server with HMR
#
# Usage:
#   docker compose up          # start both services
#   docker compose up backend  # start backend only

services:
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    ports:
      - "5000:5000"
    volumes:
      # Mount source so gunicorn --reload picks up changes
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      FLASK_ENV: development
      FLASK_DEBUG: "true"
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    working_dir: /app
    # Run Vite dev server bound to all interfaces so Docker port mapping works
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # Prevent the container node_modules from being overwritten by the host mount
      - /app/node_modules
    environment:
      # Empty → Vite proxy forwards /api/* to localhost:5000 (inside the container
      # this goes to the backend service via Docker's internal DNS)
      VITE_API_BASE_URL: "http://backend:5000"
    depends_on:
      - backend
    restart: unless-stopped
